name: One-time prospective S5P CO interim v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prospective-s5p-co-interim-v1.yml'
      - 'scripts/analyze_prospective_s5p_co_interim_v1.py'
      - 'docs/WILDFIRE_TRANSPORT_PROSPECTIVE_S5P_CO_INTERIM_V1.md'

permissions: {}

jobs:
  analyze:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: production-secrets
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout isolated research data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research-data
          path: .research-data
          fetch-depth: 1
          persist-credentials: false

      - name: Stage exact immutable freeze before secret use
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          src = Path('.research-data/data/research/wildfire_transport_prospective_v2/frozen/20260925T200833Z.json')
          doc = json.loads(src.read_text(encoding='utf-8'))
          rows = [x for x in (doc.get('records') or []) if isinstance(x, dict) and x.get('prediction_sha256')]
          if doc.get('experiment') != 'WILDFIRE_TRANSPORT_PROSPECTIVE_V2' or len(rows) != 12:
              raise SystemExit('unexpected prospective freeze')
          shutil.copy2(src, '/tmp/prospective-freeze.json')
          print('PROSPECTIVE_FREEZE_STAGE=PASS records=12')
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check earthengine-api==1.7.45 shapely==2.1.2 pyproj==3.8.0 numpy==2.5.3 rasterio==1.5.1

      - name: Run precommitted S5P CO interim comparison
        env:
          GEE_PROJECT_ID: ${{ vars.EE_PROJECT || secrets.EE_PROJECT || secrets.GEE_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON || secrets.GEE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: scripts
        run: |
          python scripts/analyze_prospective_s5p_co_interim_v1.py \
            --freeze-json /tmp/prospective-freeze.json \
            --output /tmp/prospective-s5p-co-interim-v1.json

      - name: Enforce frozen eligibility and output contract
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          path = Path('/tmp/prospective-s5p-co-interim-v1.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          if doc.get('experiment') != 'WILDFIRE_TRANSPORT_PROSPECTIVE_S5P_CO_INTERIM_V1':
              raise SystemExit('unexpected experiment')
          if doc.get('status') != 'interim_precheckpoint_no_decision':
              raise SystemExit('unexpected interim status')
          summary = doc.get('summary') or {}
          exact = summary.get('exact_transport_window') or {}
          day = summary.get('transport_end_utc_day') or {}
          if int(exact.get('eligible_events') or -1) != 7:
              raise SystemExit(f"exact-window eligibility drift: {exact.get('eligible_events')}")
          if int(day.get('eligible_events') or -1) != 11:
              raise SystemExit(f"end-day eligibility drift: {day.get('eligible_events')}")
          raw = path.read_text(encoding='utf-8')
          secret_patterns = [
              r'gh[pousr]_[A-Za-z0-9]{20,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'AIza[A-Za-z0-9_-]{20,}',
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              r'"private_key"\s*:\s*"-----BEGIN',
          ]
          if any(re.search(p, raw) for p in secret_patterns):
              raise SystemExit('credential-like material detected')
          print('PROSPECTIVE_S5P_CO_INTERIM_OUTPUT_CONTRACT=PASS exact=7 day=11')
          PY

      - name: Upload immutable interim evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prospective-s5p-co-interim-v1-${{ github.run_id }}
          path: /tmp/prospective-s5p-co-interim-v1.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: analyze
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated research data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research-data
          fetch-depth: 1

      - name: Download verified interim evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prospective-s5p-co-interim-v1-${{ github.run_id }}
          path: .interim-artifact

      - name: Validate and materialize immutable outcome evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          src = Path('.interim-artifact/prospective-s5p-co-interim-v1.json')
          doc = json.loads(src.read_text(encoding='utf-8'))
          if doc.get('experiment') != 'WILDFIRE_TRANSPORT_PROSPECTIVE_S5P_CO_INTERIM_V1':
              raise SystemExit('unexpected interim artifact')
          if doc.get('status') != 'interim_precheckpoint_no_decision':
              raise SystemExit('unexpected interim status')
          target = Path('data/research/wildfire_transport_prospective_v2/outcomes/s5p_co_interim_v1/20260925T200833Z.json')
          if target.exists():
              raise SystemExit(f'refusing to overwrite existing outcome evidence: {target}')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('TARGET_OUTCOME=' + target.as_posix() + '\n')
          print('PROSPECTIVE_S5P_CO_INTERIM_HANDOFF=PASS target=' + target.as_posix())
          PY

      - name: Commit immutable interim outcome evidence
        shell: bash
        run: |
          set -euo pipefail
          git add "$TARGET_OUTCOME"
          git config user.name 'climate-pulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: archive prospective S5P CO interim outcome"
          git pull --rebase origin research-data
          git push origin HEAD:research-data
