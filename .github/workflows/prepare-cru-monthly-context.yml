name: Prepare CRU monthly seasonal context

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-pulse-production-write-lock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 netCDF4==1.7.4
      - run: python -m py_compile scripts/prepare_cru_monthly_context.py
      - run: python scripts/prepare_cru_monthly_context.py
      - name: Commit CRU monthly context
        run: |
          set -euo pipefail
          git config user.name 'climate-pulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/climate/cru_ts_4.10/monthly
          git diff --cached --quiet && exit 0
          git commit -m 'data: add CRU seasonal monthly climate context'
          git pull --rebase origin main
          git push origin main
