name: Prepare CRU monthly seasonal context

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_cru_monthly_context.py'
      - '.github/workflows/prepare-cru-monthly-context.yml'

permissions:
  contents: write

concurrency:
  group: climate-reference-data-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy netCDF4

      - name: Syntax check
        run: python -m py_compile scripts/prepare_cru_monthly_context.py

      - name: Build 1981-2010 normal and 2016-2025 recent same-month context
        run: python scripts/prepare_cru_monthly_context.py

      - name: Inspect compact monthly products
        shell: bash
        run: |
          du -sh data/reference/climate/cru_ts_4.10/monthly
          find data/reference/climate/cru_ts_4.10/monthly -name '*.nc' -printf '%s %p\n' | sort -nr

      - name: Commit CRU monthly context
        shell: bash
        run: |
          git config user.name "climate-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/climate/cru_ts_4.10/monthly
          if git diff --cached --quiet; then
            echo "No CRU monthly-context changes to commit."
            exit 0
          fi
          git commit -m "data: add CRU seasonal monthly climate context"
          git pull --rebase origin main
          git push origin main
