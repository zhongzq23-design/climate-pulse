name: Prepare FAO CROPGRIDS 2020 reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_cropgrids_2020.py'
      - '.github/workflows/prepare-cropgrids-2020.yml'
      - 'data/reference/crops/cropgrids_2020/metadata.json'

permissions:
  contents: write

concurrency:
  group: prepare-cropgrids-2020
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore CROPGRIDS source cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/climate-pulse/cropgrids
          key: cropgrids-v1.08-nc-maps-44950942

      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy netCDF4 rasterio

      - name: Build compact crop-area reference
        env:
          CLIMATE_PULSE_CACHE_DIR: ~/.cache/climate-pulse
        run: python scripts/prepare_cropgrids_2020.py

      - name: Commit derived reference
        shell: bash
        run: |
          git config user.name "climate-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/crops/cropgrids_2020
          if git diff --cached --quiet; then
            echo "No CROPGRIDS reference changes to commit."
            exit 0
          fi
          git commit -m "data: prepare FAO CROPGRIDS 2020 crop-area reference"
          git pull --rebase origin main
          git push origin main
