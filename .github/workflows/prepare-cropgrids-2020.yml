name: Prepare FAO CROPGRIDS 2020 reference

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-pulse-production-write-lock
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Checkout isolated production data
        uses: actions/checkout@v4
        with:
          ref: production-data
          path: .production-data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest generated reference
        run: python scripts/production_data_branch.py restore --store .production-data --paths data/reference/crops/cropgrids_2020
      - uses: actions/cache@v4
        with:
          path: ~/.cache/climate-pulse/cropgrids
          key: cropgrids-v1.08-nc-maps-44950942
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 netCDF4==1.7.4 rasterio==1.5.1
      - env:
          CLIMATE_PULSE_CACHE_DIR: /home/runner/.cache/climate-pulse
        run: python scripts/prepare_cropgrids_2020.py
      - name: Publish generated reference into isolated data checkout
        run: python scripts/production_data_branch.py publish --store .production-data --paths data/reference/crops/cropgrids_2020
      - name: Commit derived reference
        working-directory: .production-data
        run: |
          set -euo pipefail
          git config user.name 'climate-pulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/crops/cropgrids_2020
          git diff --cached --quiet && exit 0
          git commit -m 'data: prepare FAO CROPGRIDS 2020 crop-area reference'
          git pull --rebase origin production-data
          git push origin HEAD:production-data
