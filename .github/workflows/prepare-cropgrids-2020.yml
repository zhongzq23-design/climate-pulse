name: Prepare FAO CROPGRIDS 2020 reference

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-pulse-production-write-lock
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/climate-pulse/cropgrids
          key: cropgrids-v1.08-nc-maps-44950942
      - run: python -m pip install --disable-pip-version-check numpy netCDF4 rasterio
      - env:
          CLIMATE_PULSE_CACHE_DIR: /home/runner/.cache/climate-pulse
        run: python scripts/prepare_cropgrids_2020.py
      - name: Commit derived reference
        run: |
          set -euo pipefail
          git config user.name 'climate-pulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/crops/cropgrids_2020
          git diff --cached --quiet && exit 0
          git commit -m 'data: prepare FAO CROPGRIDS 2020 crop-area reference'
          git pull --rebase origin main
          git push origin main
