name: Validate secret-dependent climate access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earth-engine-probe:
    runs-on: ubuntu-latest
    environment: production-secrets
    timeout-minutes: 15
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install climate dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 netCDF4==1.7.4 earthengine-api==1.7.45

      - name: Probe recent 7-day IFS access when configured
        env:
          EE_PROJECT: ${{ vars.EE_PROJECT || secrets.EE_PROJECT || secrets.GEE_PROJECT_ID }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON || secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          if not os.environ.get('EE_SERVICE_ACCOUNT_JSON', '').strip():
              print('EE_IFS_7DAY_PROBE=SKIPPED_NO_SERVICE_ACCOUNT_SECRET')
              raise SystemExit(0)
          from scripts.enrich_climate_context import RECENT_DAYS, recent_7day_ifs_image
          meta, samples = recent_7day_ifs_image(
              [{'grid_lon': 0.0, 'grid_lat': 0.0, 'sample_key': 'probe'}],
              {'tmp', 'pre', 'vpd'},
              datetime.now(timezone.utc),
          )
          assert meta['status'] == 'ready', meta
          assert meta['day_count'] == RECENT_DAYS == 7, meta
          values = samples.get('probe') or {}
          assert all(values.get(k) is not None for k in ('tmp', 'pre', 'vpd')), values
          print('EE_IFS_7DAY_PROBE=PASS')
          print('IFS_7DAY_WINDOW=' + meta['window_start'] + ' -> ' + meta['window_end'])
          PY
