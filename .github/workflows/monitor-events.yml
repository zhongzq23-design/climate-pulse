name: Monitor climate events

on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/monitor_events.py'
      - 'scripts/enrich_hazard_exposure.py'
      - '.github/workflows/monitor-events.yml'
      - 'data/reference/population/metadata.json'

permissions:
  contents: write

concurrency:
  group: climate-event-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore GHSL population cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/climate-pulse/population
          key: ghsl-wup-pop-r2025a-e2025-1km-v1

      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio shapely

      - name: Fetch, normalize, deduplicate and archive events
        run: python scripts/monitor_events.py

      - name: Enrich wildfire and cyclone exposure
        env:
          CLIMATE_PULSE_CACHE_DIR: ~/.cache/climate-pulse
        run: python scripts/enrich_hazard_exposure.py

      - name: Commit data snapshot and exposure products
        shell: bash
        run: |
          git config user.name "climate-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events data/exposure/population
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh climate events and exposure $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
