name: Monitor climate events

on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/monitor_events.py'
      - 'scripts/run_event_monitor.py'
      - 'scripts/enrich_hazard_exposure.py'
      - 'scripts/run_hazard_enrichment.py'
      - 'scripts/source_metric_utils.py'
      - 'scripts/wildfire_episode_metrics.py'
      - 'scripts/sync_wildfire_episode_metrics.py'
      - 'scripts/enrich_event_footprints.py'
      - 'scripts/enrich_asset_exposure.py'
      - 'scripts/enrich_climate_context.py'
      - 'tests/test_source_metric_utils.py'
      - 'tests/test_wildfire_episode_sync.py'
      - '.github/workflows/monitor-events.yml'
      - 'data/reference/population/metadata.json'
      - 'data/reference/climate/cru_ts_4.10/annual/index.json'
      - 'data/reference/landcover/modis_mcd12c1_2024/**'
      - 'data/reference/crops/cropgrids_2020/**'

permissions:
  contents: write

concurrency:
  group: climate-event-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore GHSL population cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/climate-pulse/population
          key: ghsl-wup-pop-r2025a-e2025-1km-v1

      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio shapely pyproj netCDF4

      - name: Run parser regression tests
        run: python -m unittest discover -s tests -v

      - name: Fetch, normalize, deduplicate and archive events
        run: python scripts/run_event_monitor.py

      - name: Enrich source-first wildfire and cyclone population metrics
        env:
          CLIMATE_PULSE_CACHE_DIR: ~/.cache/climate-pulse
        run: python scripts/run_hazard_enrichment.py

      - name: Align wildfire headline metrics to the same GDACS episode
        run: python scripts/sync_wildfire_episode_metrics.py

      - name: Persist mapped event footprints
        run: python scripts/enrich_event_footprints.py

      - name: Enrich supplemental land forest crop and GDP exposure
        env:
          CLIMATE_PULSE_CACHE_DIR: ~/.cache/climate-pulse
        run: python scripts/enrich_asset_exposure.py

      - name: Enrich annual event climate context
        run: python scripts/enrich_climate_context.py

      - name: Commit event, exposure, footprint and climate-context products
        shell: bash
        run: |
          git config user.name "climate-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events data/exposure/population data/exposure/assets data/footprints data/climate/event_timeseries
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh events, exposure, footprints and climate context $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin main
          git push origin main
