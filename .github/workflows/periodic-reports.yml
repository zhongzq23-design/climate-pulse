name: Publish Climate Pulse reports

on:
  schedule:
    - cron: '40 6 * * 1'
    - cron: '10 7 1 * *'
  workflow_dispatch:
    inputs:
      period:
        description: Report period to publish
        required: true
        default: rolling
        type: choice
        options: [rolling, previous-week, previous-month]

permissions:
  contents: write

concurrency:
  group: climate-pulse-production-write-lock
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Checkout isolated production data
        uses: actions/checkout@v4
        with:
          ref: production-data
          path: .production-data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest report state
        run: python scripts/production_data_branch.py restore --store .production-data --paths data/events data/exposure/population data/exposure/assets data/footprints data/climate/event_timeseries data/history/daily data/reports reports data/reference/crops/cropgrids_2020 data/reference/climate/cru_ts_4.10 data/reference/landcover/modis_mcd12c1_2024 data/reference/population
      - uses: actions/cache@v4
        with:
          path: ~/.cache/climate-pulse/population
          key: ghsl-wup-pop-r2025a-e2025-1km-v1
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 rasterio==1.5.1 shapely==2.1.2 pyproj==3.8.0 netCDF4==1.7.4
      - name: Run reporting regression tests
        run: python -m unittest discover -s tests -p 'test_reporting_storage.py' -v
      - name: Resolve report period
        id: period
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.period }}"
          elif [ "${{ github.event.schedule }}" = "40 6 * * 1" ]; then
            MODE="previous-week"
          else
            MODE="previous-month"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Build report publication
        env:
          CLIMATE_PULSE_CACHE_DIR: /home/runner/.cache/climate-pulse
        run: python scripts/run_periodic_reports.py --mode "${{ steps.period.outputs.mode }}"
      - name: Publish reports into isolated data checkout
        run: python scripts/production_data_branch.py publish --store .production-data --paths data/reports reports
      - name: Commit report publication
        working-directory: .production-data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'climate-pulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports reports
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
            exit 0
          fi
          git commit -m "reports: publish ${{ steps.period.outputs.mode }} $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin production-data
          git push origin HEAD:production-data
