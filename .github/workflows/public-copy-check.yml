name: Public science copy policy

on:
  pull_request:
    paths:
      - 'index.html'
      - 'methods*.html'
      - '*methodology*.html'
      - '*description*.html'
      - '*definition*.html'
      - '*explainer*.html'
      - 'reports.html'
      - 'reports/**/*.html'
      - 'docs/**/*.html'
      - 'docs/PUBLIC_SCIENCE_WRITING_RULES.md'
      - 'AGENTS.md'
      - 'scripts/check_public_science_copy.py'
      - 'tests/test_public_science_copy_policy.py'
      - '.github/workflows/public-copy-check.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public science writing policy
        run: |
          python -m unittest discover -s tests -p 'test_public_science_copy_policy.py' -v
          python scripts/check_public_science_copy.py
