name: One-time prospective publish handoff diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prospective-publish-diagnostic.yml'

permissions: {}

jobs:
  make-handoff:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Create synthetic verified-shaped handoff
        run: |
          mkdir -p /tmp/handoff
          python - <<'PY'
          import json
          from pathlib import Path
          doc = {
              "schema_version": "diagnostic",
              "experiment": "WILDFIRE_TRANSPORT_PROSPECTIVE_V2",
              "phase": "prediction_freeze",
              "frozen_at": "2026-09-25T20:00:00Z",
              "records": [
                  {
                      "event": {"id": "diagnostic-only"},
                      "prediction_sha256": "a" * 64,
                  }
              ],
          }
          Path('/tmp/handoff/prospective-freeze.json').write_text(
              json.dumps(doc, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Upload handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prospective-publish-diagnostic-${{ github.run_id }}
          path: /tmp/handoff/prospective-freeze.json
          if-no-files-found: error
          retention-days: 1

  publish-dryrun:
    needs: make-handoff
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research-data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research-data
          fetch-depth: 1

      - name: Download handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prospective-publish-diagnostic-${{ github.run_id }}
          path: .freeze-artifact

      - name: Run production-equivalent handoff validation without committing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          src = Path('.freeze-artifact/prospective-freeze.json')
          doc = json.loads(src.read_text(encoding='utf-8'))
          if doc.get('experiment') != 'WILDFIRE_TRANSPORT_PROSPECTIVE_V2':
              raise SystemExit('unexpected prospective artifact experiment')
          rows = [x for x in (doc.get('records') or []) if isinstance(x, dict)]
          frozen = [x for x in rows if isinstance(x.get('prediction_sha256'), str)]
          if not frozen:
              raise SystemExit('prospective handoff contains no frozen predictions')
          if any(len(x['prediction_sha256']) != 64 for x in frozen):
              raise SystemExit('prospective handoff contains invalid prediction hash')
          raw = src.read_text(encoding='utf-8')
          forbidden = [
              r'gh[pousr]_[A-Za-z0-9]{20,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'AIza[A-Za-z0-9_-]{20,}',
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              r'"private_key"\s*:\s*"-----BEGIN',
          ]
          for pattern in forbidden:
              if re.search(pattern, raw):
                  raise SystemExit('credential-like material detected')
          print(f'PROSPECTIVE_HANDOFF_VALIDATION=PASS frozen={len(frozen)}')
          PY

      - name: Verify research-data push authorization without changing branch
        run: |
          set -euo pipefail
          git push --dry-run origin HEAD:research-data
          echo 'RESEARCH_DATA_PUSH_DRYRUN=PASS'
