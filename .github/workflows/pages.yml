name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build lightweight public site artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data/events
          cp index.html methods.html README.md _site/
          cp -R assets _site/assets
          cp data/events/latest.json _site/data/events/latest.json
          # Large scientific reference rasters/NetCDF files remain accessible
          # through the public GitHub repository / raw.githubusercontent.com,
          # but are intentionally excluded from every Pages deployment.

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
