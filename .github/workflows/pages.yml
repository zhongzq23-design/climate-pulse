name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build lightweight public site artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data/events _site/data/climate/event_timeseries _site/data/footprints
          cp index.html methods.html README.md _site/
          cp -R assets _site/assets
          cp data/events/latest.json _site/data/events/latest.json
          if [ -d data/climate/event_timeseries ]; then
            cp -R data/climate/event_timeseries/. _site/data/climate/event_timeseries/
          fi
          if [ -d data/footprints ]; then
            cp -R data/footprints/. _site/data/footprints/
          fi
          # Large scientific NetCDF/raster reference files remain in the public
          # GitHub repository and are intentionally excluded from each Pages build.
          # Only compact browser-facing event JSON and simplified footprints deploy.

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
