name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Monitor climate events
      - Publish Climate Pulse reports
      - Prepare FAO CROPGRIDS 2020 reference
      - Prepare CRU annual climate context
      - Prepare CRU monthly seasonal context
      - Prepare NASA MODIS 2024 landcover reference
      - Prepare population reference
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate public science copy
        run: python scripts/check_public_science_copy.py
      - name: Build filtered Pages artifact
        run: python scripts/build_public_dist.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
