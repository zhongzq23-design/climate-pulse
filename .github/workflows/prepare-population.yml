name: Prepare population reference

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-pulse-production-write-lock
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Checkout isolated production data
        uses: actions/checkout@v4
        with:
          ref: production-data
          path: .production-data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest generated reference
        run: python scripts/production_data_branch.py restore --store .production-data --paths data/reference/population
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 rasterio==1.5.1
      - run: python scripts/prepare_population.py
      - name: Publish generated reference into isolated data checkout
        run: python scripts/production_data_branch.py publish --store .production-data --paths data/reference/population
      - name: Commit derived population reference
        working-directory: .production-data
        run: |
          set -euo pipefail
          git config user.name 'climate-pulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/population
          git diff --cached --quiet && exit 0
          git commit -m 'data: add GHSL 2025 population reference'
          git pull --rebase origin production-data
          git push origin HEAD:production-data
