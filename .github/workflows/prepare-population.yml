name: Prepare population reference

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/prepare_population.py'
      - '.github/workflows/prepare-population.yml'

permissions:
  contents: write

concurrency:
  group: prepare-population
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy rasterio

      - name: Download GHSL and build compact reference
        run: python scripts/prepare_population.py

      - name: Commit derived population reference
        shell: bash
        run: |
          git config user.name "climate-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/population
          if git diff --cached --quiet; then
            echo "No population reference changes to commit."
            exit 0
          fi
          git commit -m "data: add GHSL 2025 population reference"
          git push
