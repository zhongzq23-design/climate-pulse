name: One-time IFS transport diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ifs-transport-diagnostic.yml'
      - 'scripts/wildfire_transport_prospective_v2.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production-secrets
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout isolated production data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production-data
          path: .production-data
          fetch-depth: 1
          persist-credentials: false

      - name: Restore fresh event and footprint data
        run: python scripts/production_data_branch.py restore --store .production-data --paths data/events data/footprints

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check earthengine-api==1.7.45 shapely==2.1.2 pyproj==3.8.0 numpy==2.5.3 rasterio==1.5.1

      - name: Local preflight
        env:
          PYTHONPATH: scripts
        run: |
          python -c "import wildfire_transport_prospective_v2; print('PROSPECTIVE_IMPORT_CLOSURE=PASS')"
          python scripts/wildfire_transport_prospective_v2.py selftest
          python scripts/wildfire_transport_prospective_v2.py inspect \
            --snapshot data/events/latest.json \
            --footprint-root . \
            --min-valid 12

      - name: Probe real IFS cycle selection and exact freeze path
        env:
          GEE_PROJECT_ID: ${{ vars.EE_PROJECT || secrets.EE_PROJECT || secrets.GEE_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON || secrets.GEE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import probe_wildfire_downwind as p
          import wildfire_transport_prospective_v2 as v2

          ee, _ = p.initialize_ee()
          run, creation_ms, leads, start_offset_h, age_h, diagnostics = v2.choose_forward_ifs_window(
              ee, datetime.now(timezone.utc), 12
          )
          assert len(leads) == 5 and leads[-1] - leads[0] == 12, leads
          assert abs(start_offset_h) <= 3.1, start_offset_h
          assert age_h <= 36.0, age_h
          print('IFS_FORWARD_WINDOW_SELECTOR=PASS')
          print('IFS_CREATION_TIME=' + str(p.millis_to_iso(creation_ms)))
          print('IFS_CYCLE_AGE_HOURS=' + str(round(age_h, 3)))
          print('IFS_WINDOW_START_OFFSET_HOURS=' + str(round(start_offset_h, 3)))
          print('IFS_LEADS=' + ','.join(str(x) for x in leads))
          print('IFS_WINDOW_START=' + str(p.millis_to_iso(creation_ms + leads[0] * 3600000)))
          print('IFS_WINDOW_END=' + str(p.millis_to_iso(creation_ms + leads[-1] * 3600000)))
          print('IFS_DIAGNOSTICS=' + str(diagnostics[:4]))
          PY
          python scripts/wildfire_transport_prospective_v2.py freeze --output /tmp/prospective-diagnostic.json
          python scripts/wildfire_transport_prospective_v2.py verify --input /tmp/prospective-diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('/tmp/prospective-diagnostic.json').read_text(encoding='utf-8'))
          rows=doc.get('records') or []
          frozen=[x for x in rows if isinstance(x,dict) and x.get('prediction_sha256')]
          excluded=[x for x in rows if isinstance(x,dict) and x.get('status')=='excluded']
          if not frozen:
              raise SystemExit('DIAGNOSTIC_NO_FROZEN_EVENTS')
          print(f'PROSPECTIVE_EXACT_DRYRUN=PASS frozen={len(frozen)} excluded={len(excluded)} attempted={doc.get("attempted_events")}')
          print('PROSPECTIVE_FROZEN_IDS=' + ','.join(str((x.get('event') or {}).get('id')) for x in frozen))
          PY
