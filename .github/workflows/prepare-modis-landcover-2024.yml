name: Prepare NASA MODIS 2024 landcover reference

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate-pulse-production-write-lock
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production-secrets
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - name: Checkout isolated production data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production-data
          path: .production-data
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore latest generated reference
        run: python scripts/production_data_branch.py restore --store .production-data --paths data/reference/landcover/modis_mcd12c1_2024
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/climate-pulse/modis
          key: mcd12c1-v061-2024-a2024001
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 rasterio==1.5.1 pyproj==3.8.0 pyhdf==0.11.7
      - name: Build landcover reference
        env:
          CLIMATE_PULSE_CACHE_DIR: /home/runner/.cache/climate-pulse
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python scripts/prepare_modis_landcover_2024.py
      - name: Publish generated reference into isolated data checkout
        if: ${{ hashFiles('data/reference/landcover/modis_mcd12c1_2024/land_forest_area_ha_0p05.tif') != '' }}
        run: python scripts/production_data_branch.py publish --store .production-data --paths data/reference/landcover/modis_mcd12c1_2024
      - name: Commit derived reference when built
        working-directory: .production-data
        run: |
          set -euo pipefail
          if [ ! -f data/reference/landcover/modis_mcd12c1_2024/land_forest_area_ha_0p05.tif ]; then
            echo 'MODIS reference not built; EARTHDATA_TOKEN may not be configured.'
            exit 0
          fi
          git config user.name 'climate-pulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/landcover/modis_mcd12c1_2024
          git diff --cached --quiet && exit 0
          git commit -m 'data: prepare NASA MODIS 2024 land and forest reference'
          git pull --rebase origin production-data
          git push origin HEAD:production-data
